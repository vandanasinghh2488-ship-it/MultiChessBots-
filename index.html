<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AI Chess Arena Mobile</title>
  
  <!-- Google AdSense -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7944975117604881"
       crossorigin="anonymous"></script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --light-sq: #e2e8f0;
      --dark-sq: #64748b;
      --hl-sq: #facc15;
      --last-move: rgba(59, 130, 246, 0.45);
      --text: #f8fafc;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0.6rem 0.5rem 1.5rem;
      overflow-x: hidden;
    }

    header {
      text-align: center;
      margin-bottom: 0.5rem;
    }

    h1 {
      font-size: 1.35rem;
      font-weight: 800;
      background: linear-gradient(135deg, #38bdf8, #a855f7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .main-container {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      align-items: center;
      width: 100%;
      max-width: 420px;
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      padding: 0.45rem 0.7rem;
      background: var(--card-bg);
      border-radius: 8px;
      font-size: 0.82rem;
      border: 1px solid #334155;
    }

    .bot-profile {
      display: flex;
      align-items: center;
      gap: 0.45rem;
    }

    .avatar {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 0.72rem;
      color: #fff;
    }

    .gemini-avatar { background: #2563eb; }
    .chatgpt-avatar { background: #10a37f; }
    .claude-avatar { background: #d97706; }
    .grok-avatar { background: #000000; border: 1px solid #555; }

    /* Perfectly responsive square chess board */
    #board {
      width: min(94vw, 390px);
      height: min(94vw, 390px);
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      grid-template-rows: repeat(8, 1fr);
      border: 3px solid #334155;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 8px 20px rgba(0,0,0,0.4);
    }

    .square {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: min(7.5vw, 32px);
      cursor: pointer;
      position: relative;
    }

    .square.light { background-color: var(--light-sq); }
    .square.dark { background-color: var(--dark-sq); }
    .square.selected { background-color: var(--hl-sq) !important; }
    .square.last-move { background-color: var(--last-move) !important; }

    .square.valid-dest::after {
      content: '';
      width: 28%;
      height: 28%;
      background: rgba(16, 185, 129, 0.75);
      border-radius: 50%;
      position: absolute;
    }

    .sidebar {
      background: var(--card-bg);
      border-radius: 10px;
      padding: 0.7rem;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      border: 1px solid #334155;
    }

    .section-title {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #94a3b8;
      margin-bottom: 0.35rem;
    }

    .bot-selector {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.35rem;
    }

    .bot-btn {
      background: #0f172a;
      border: 1.5px solid transparent;
      color: #cbd5e1;
      padding: 0.45rem 0.2rem;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.75rem;
      text-align: center;
      cursor: pointer;
      transition: all 0.15s;
    }

    .bot-btn.active {
      border-color: #38bdf8;
      background: #1e3a8a;
      color: #fff;
    }

    .bot-desc {
      font-size: 0.75rem;
      color: #93c5fd;
      line-height: 1.25;
      background: rgba(15, 23, 42, 0.6);
      padding: 0.4rem 0.5rem;
      border-radius: 6px;
    }

    .move-history {
      background: #0f172a;
      height: 65px;
      border-radius: 6px;
      padding: 0.4rem;
      overflow-y: auto;
      font-family: monospace;
      font-size: 0.75rem;
      display: grid;
      grid-template-columns: 28px 1fr 1fr;
      row-gap: 0.2rem;
      align-content: start;
    }

    .controls {
      display: flex;
      gap: 0.4rem;
    }

    .btn {
      flex: 1;
      background: #2563eb;
      color: white;
      border: none;
      padding: 0.5rem;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.8rem;
      cursor: pointer;
    }

    .btn-secondary { background: #475569; }

    #bot-thinking {
      display: none;
      font-size: 0.75rem;
      color: #fbbf24;
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
  </style>
</head>
<body>

  <header>
    <h1>AI Chess Arena</h1>
  </header>

  <div class="main-container">
    <div class="status-bar">
      <div class="bot-profile">
        <div class="avatar gemini-avatar" id="bot-avatar">G</div>
        <div>
          <strong id="active-bot-name">Gemini</strong>
          <span id="bot-thinking"> (thinking...)</span>
        </div>
      </div>
      <div id="game-status" style="color: #38bdf8; font-weight:600;">Your turn (White)</div>
    </div>

    <!-- 100% responsive Board -->
    <div id="board"></div>

    <div class="sidebar">
      <div>
        <div class="section-title">Select Opponent</div>
        <div class="bot-selector">
          <button class="bot-btn active" onclick="selectBot('gemini')">Gemini</button>
          <button class="bot-btn" onclick="selectBot('chatgpt')">ChatGPT</button>
          <button class="bot-btn" onclick="selectBot('claude')">Claude</button>
          <button class="bot-btn" onclick="selectBot('grok')">Grok</button>
        </div>
      </div>

      <div class="bot-desc" id="bot-description">
        Gemini: Strategic & balanced. Focuses on central control and mobility.
      </div>

      <div>
        <div class="section-title">Move History</div>
        <div class="move-history" id="move-history"></div>
      </div>

      <div class="controls">
        <button class="btn btn-secondary" onclick="undoMove()">↩ Undo</button>
        <button class="btn" onclick="resetGame()">↻ New Game</button>
      </div>
    </div>
  </div>

  <script>
    const chess = new Chess();
    let selectedSquare = null;
    let currentBot = 'gemini';
    let isThinking = false;
    let lastMove = null;

    const BOT_CONFIGS = {
      gemini: {
        name: "Gemini",
        char: "G",
        colorClass: "gemini-avatar",
        desc: "Gemini: Strategic & balanced. Focuses on central control and mobility.",
        centerBias: 25,
        aggression: 1.0
      },
      chatgpt: {
        name: "ChatGPT",
        char: "C",
        colorClass: "chatgpt-avatar",
        desc: "ChatGPT: Creative & open. Prioritizes coordination and pawn structures.",
        centerBias: 15,
        aggression: 1.2
      },
      claude: {
        name: "Claude",
        char: "Cl",
        colorClass: "claude-avatar",
        desc: "Claude: Deep defense & analytical. Fortifies king safety carefully.",
        centerBias: 10,
        aggression: 0.9
      },
      grok: {
        name: "Grok",
        char: "Gr",
        colorClass: "grok-avatar",
        desc: "Grok: Hyper-aggressive & chaotic. Attacks fast and trades sharply.",
        centerBias: 35,
        aggression: 1.6
      }
    };

    const PIECE_SYMBOLS = {
      'p': '♟', 'r': '♜', 'n': '♞', 'b': '♝', 'q': '♛', 'k': '♚',
      'P': '♙', 'R': '♖', 'N': '♘', 'B': '♗', 'Q': '♕', 'K': '♔'
    };

    const PIECE_VALUES = {
      p: 100, n: 320, b: 330, r: 500, q: 900, k: 20000
    };

    function selectBot(botKey) {
      currentBot = botKey;
      document.querySelectorAll('.bot-btn').forEach(btn => {
        btn.classList.toggle('active', btn.innerText.toLowerCase().includes(botKey));
      });
      const cfg = BOT_CONFIGS[botKey];
      document.getElementById('active-bot-name').innerText = cfg.name;
      document.getElementById('bot-description').innerText = cfg.desc;
      const avatar = document.getElementById('bot-avatar');
      avatar.innerText = cfg.char;
      avatar.className = `avatar ${cfg.colorClass}`;
      resetGame();
    }

    function renderBoard() {
      const boardEl = document.getElementById('board');
      boardEl.innerHTML = '';
      const board = chess.board();

      for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
          const square = document.createElement('div');
          const squareId = `${String.fromCharCode(97 + c)}${8 - r}`;
          const isDark = (r + c) % 2 === 1;

          square.className = `square ${isDark ? 'dark' : 'light'}`;
          square.dataset.square = squareId;

          if (selectedSquare === squareId) square.classList.add('selected');
          if (lastMove && (lastMove.from === squareId || lastMove.to === squareId)) {
            square.classList.add('last-move');
          }

          if (selectedSquare) {
            const moves = chess.moves({ square: selectedSquare, verbose: true });
            if (moves.some(m => m.to === squareId)) {
              square.classList.add('valid-dest');
            }
          }

          const piece = board[r][c];
          if (piece) {
            const sym = piece.color === 'w' ? PIECE_SYMBOLS[piece.type.toUpperCase()] : PIECE_SYMBOLS[piece.type];
            square.innerText = sym;
            square.style.color = piece.color === 'w' ? '#ffffff' : '#000000';
            square.style.textShadow = piece.color === 'w' ? '0 1px 2px rgba(0,0,0,0.8)' : '0 1px 2px rgba(255,255,255,0.4)';
          }

          square.addEventListener('click', (e) => {
            e.preventDefault();
            handleSquareClick(squareId);
          });
          boardEl.appendChild(square);
        }
      }
      updateStatus();
    }

    function handleSquareClick(squareId) {
      if (isThinking || chess.game_over()) return;

      const piece = chess.get(squareId);

      if (selectedSquare) {
        if (selectedSquare === squareId) {
          selectedSquare = null;
          renderBoard();
          return;
        }

        const move = chess.move({
          from: selectedSquare,
          to: squareId,
          promotion: 'q'
        });

        if (move) {
          lastMove = move;
          selectedSquare = null;
          recordMove(move);
          renderBoard();
          if (!chess.game_over()) {
            triggerBotMove();
          }
          return;
        }
      }

      if (piece && piece.color === 'w') {
        selectedSquare = squareId;
        renderBoard();
      }
    }

    function triggerBotMove() {
      isThinking = true;
      document.getElementById('bot-thinking').style.display = 'inline';
      document.getElementById('game-status').innerText = `${BOT_CONFIGS[currentBot].name} thinking...`;

      setTimeout(() => {
        const move = evaluateBestMove();
        if (move) {
          chess.move(move);
          lastMove = move;
          recordMove(move);
        }
        isThinking = false;
        document.getElementById('bot-thinking').style.display = 'none';
        renderBoard();
      }, 300);
    }

    function evaluateBestMove() {
      const moves = chess.moves({ verbose: true });
      if (moves.length === 0) return null;

      const config = BOT_CONFIGS[currentBot];
      let bestMove = null;
      let bestScore = -Infinity;

      for (const m of moves) {
        let score = 0;

        if (m.captured) {
          score += (PIECE_VALUES[m.captured] * 1.5) * config.aggression;
        }

        if (['d4', 'd5', 'e4', 'e5'].includes(m.to)) score += config.centerBias;
        if (['c4', 'c5', 'f4', 'f5'].includes(m.to)) score += config.centerBias * 0.5;

        chess.move(m);
        if (chess.in_check()) score += 30;
        if (chess.in_checkmate()) score += 99999;
        chess.undo();

        score += Math.random() * 12;

        if (score > bestScore) {
          bestScore = score;
          bestMove = m;
        }
      }
      return bestMove || moves[0];
    }

    function recordMove(move) {
      const historyEl = document.getElementById('move-history');
      const count = chess.history().length;
      if (move.color === 'w') {
        const num = Math.ceil(count / 2);
        const numSpan = document.createElement('div');
        numSpan.style.color = '#64748b';
        numSpan.innerText = `${num}.`;
        const moveSpan = document.createElement('div');
        moveSpan.innerText = move.san;
        historyEl.appendChild(numSpan);
        historyEl.appendChild(moveSpan);
      } else {
        const moveSpan = document.createElement('div');
        moveSpan.innerText = move.san;
        historyEl.appendChild(moveSpan);
      }
      historyEl.scrollTop = historyEl.scrollHeight;
    }

    function updateStatus() {
      const statusEl = document.getElementById('game-status');
      if (chess.in_checkmate()) {
        const winner = chess.turn() === 'w' ? BOT_CONFIGS[currentBot].name : 'You';
        statusEl.innerText = `Mate! ${winner} wins!`;
        statusEl.style.color = '#ef4444';
      } else if (chess.in_draw()) {
        statusEl.innerText = 'Draw!';
        statusEl.style.color = '#f59e0b';
      } else if (chess.in_check()) {
        statusEl.innerText = 'Check!';
        statusEl.style.color = '#fbbf24';
      } else {
        statusEl.innerText = chess.turn() === 'w' ? 'Your turn (White)' : `${BOT_CONFIGS[currentBot].name}'s turn`;
        statusEl.style.color = '#38bdf8';
      }
    }

    function undoMove() {
      if (isThinking) return;
      chess.undo();
      chess.undo();
      lastMove = null;
      selectedSquare = null;
      const historyEl = document.getElementById('move-history');
      historyEl.innerHTML = '';
      const history = chess.history({ verbose: true });
      history.forEach(m => recordMove(m));
      renderBoard();
    }

    function resetGame() {
      chess.reset();
      selectedSquare = null;
      lastMove = null;
      isThinking = false;
      document.getElementById('move-history').innerHTML = '';
      renderBoard();
    }

    renderBoard();
  </script>
</body>
</html>
